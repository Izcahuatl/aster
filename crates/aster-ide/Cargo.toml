[package]
name = "aster-ide"
version = "1.0.0"
edition = "2024"
description = "A focused Lua editor with static metatable insight"

[[bin]]
name = "aster-ide"
path = "src/main.rs"

[dependencies]
aster-analysis = { path = "../aster-analysis" }
full_moon = "2.2.0"
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tempfile = "3.27.0"
walkdir = "2.5"

[build-dependencies]
tauri-build = { version = "2", features = [] }
