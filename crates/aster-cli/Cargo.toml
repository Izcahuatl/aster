[package]
name = "aster-cli"
version = "1.0.0"
edition = "2024"
description = "Command-line interface for Aster Lua analysis"

[[bin]]
name = "aster"
path = "src/main.rs"

[dependencies]
aster-analysis = { path = "../aster-analysis" }
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.3"
